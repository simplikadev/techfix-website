<script>
(()=>{
 const boot=document.getElementById('tf-boot'), motion=matchMedia('(prefers-reduced-motion: reduce)');
 let seen=false,skin='green',language='de';try{seen=sessionStorage.getItem('techfix-motion-intro')==='1';skin=localStorage.getItem('techfix-skin-v5')||'green';language=localStorage.getItem('techfix-lang')||'de'}catch{}
 if(seen||motion.matches)return;
 try{sessionStorage.setItem('techfix-motion-intro','1')}catch{}
 boot.dataset.bootSkin=['green','amber','glass'].includes(skin)?skin:'green';
 const words={de:['Oberfläche wird vorbereitet…','Portfolio wird geladen…','Fast bereit…','Einführung abgeschlossen.','Überspringen ↵','Fortschritt der Einführung'],en:['Preparing interface…','Loading portfolio…','Almost ready…','Intro complete.','Skip intro ↵','Intro progress'],uk:['Підготовка інтерфейсу…','Завантаження портфоліо…','Майже готово…','Вступ завершено.','Пропустити ↵','Перебіг вступу']}[language]||['Preparing interface…','Loading portfolio…','Almost ready…','Intro complete.','Skip intro ↵','Intro progress'];
 const meter=document.getElementById('tf-boot-meter'),blocks=[...meter.children],log=document.getElementById('tf-boot-log'),percent=document.getElementById('tf-boot-percent'),skip=document.getElementById('tf-boot-skip');
 skip.textContent=words[4];meter.setAttribute('aria-label',words[5]);boot.hidden=false;let finished=false,frame=0,ready=document.readyState!=='loading',start=performance.now();
 function paint(n){blocks.forEach((b,i)=>b.classList.toggle('filled',i<n));meter.setAttribute('aria-valuenow',String(n*5));percent.textContent=String(n*5).padStart(2,'0')+'%';log.textContent=words[n===20?3:n>=14?2:n>=6?1:0];}
 function finish(immediate=false){if(finished)return;finished=true;cancelAnimationFrame(frame);clearTimeout(safety);document.removeEventListener('focusin',outside);document.removeEventListener('keydown',escape);if(motion.removeEventListener)motion.removeEventListener('change',reduce);boot.classList.add('tf-boot-out');if(boot.contains(document.activeElement))document.getElementById('main')?.focus({preventScroll:true});if(immediate||motion.matches)boot.hidden=true;else setTimeout(()=>{boot.hidden=true},260);}
 function outside(e){if(!boot.contains(e.target))finish(true)}
 function escape(e){if(e.key==='Escape')finish(true)}
 function reduce(e){if(e.matches)finish(true)}
 const safety=setTimeout(()=>finish(true),2200);
 document.addEventListener('DOMContentLoaded',()=>{ready=true},{once:true});document.addEventListener('focusin',outside);document.addEventListener('keydown',escape);motion.addEventListener?.('change',reduce);skip.onclick=()=>finish(true);
 function tick(now){if(finished)return;const elapsed=now-start;const n=Math.min(ready?20:18,Math.floor(elapsed/55));paint(n);if(n===20){finish();return}frame=requestAnimationFrame(tick)}
 paint(0);frame=requestAnimationFrame(tick);
})();
